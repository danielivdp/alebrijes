<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alebrijes · Hello World</title>
  <meta name="description" content="A Hello World page in vibrant Mexican alebrije folk-art style." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Decorative floating dots -->
  <div class="papel-picado" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="stage">
    <h1 class="title">
      <span class="word">¡Hola</span>
      <span class="word">Mundo!</span>
    </h1>
    <p class="subtitle">Hello World, alebrije style 🐉✨</p>

    <!-- Alebrije creature: a fantastical winged dragon-cat in classic Oaxacan colors -->
    <div class="creature-wrap">
      <svg class="alebrije" viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A colorful alebrije creature">
        <defs>
          <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff2e9a" />
            <stop offset="50%" stop-color="#7b2ff7" />
            <stop offset="100%" stop-color="#00c2ff" />
          </linearGradient>
          <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd000" />
            <stop offset="50%" stop-color="#ff7a00" />
            <stop offset="100%" stop-color="#ff2e9a" />
          </linearGradient>
          <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#00ff9d" />
            <stop offset="100%" stop-color="#00c2ff" />
          </linearGradient>
        </defs>

        <!-- Tail -->
        <path d="M70 250 Q10 230 40 170 Q70 210 90 200 Q60 250 120 240 Z" fill="url(#tailGrad)" stroke="#1a0033" stroke-width="3" stroke-linejoin="round" />
        <circle cx="52" cy="200" r="7" fill="#ff2e9a" stroke="#1a0033" stroke-width="2" />
        <circle cx="78" cy="218" r="6" fill="#ffd000" stroke="#1a0033" stroke-width="2" />

        <!-- Left wing -->
        <path class="wing wing-left" d="M150 150 Q60 70 40 130 Q110 140 90 180 Q140 160 150 150 Z" fill="url(#wingGrad)" stroke="#1a0033" stroke-width="3" stroke-linejoin="round" />
        <!-- Right wing -->
        <path class="wing wing-right" d="M250 150 Q340 70 360 130 Q290 140 310 180 Q260 160 250 150 Z" fill="url(#wingGrad)" stroke="#1a0033" stroke-width="3" stroke-linejoin="round" />

        <!-- Body -->
        <ellipse cx="200" cy="200" rx="90" ry="75" fill="url(#bodyGrad)" stroke="#1a0033" stroke-width="4" />

        <!-- Body dot patterns (classic alebrije decoration) -->
        <g stroke="#1a0033" stroke-width="1.5">
          <circle cx="170" cy="190" r="9" fill="#ffd000" />
          <circle cx="210" cy="175" r="7" fill="#00ff9d" />
          <circle cx="235" cy="205" r="8" fill="#ff7a00" />
          <circle cx="185" cy="225" r="6" fill="#00c2ff" />
          <circle cx="225" cy="235" r="5" fill="#ffd000" />
          <circle cx="155" cy="215" r="5" fill="#ff2e9a" />
        </g>

        <!-- Head -->
        <circle cx="200" cy="110" r="52" fill="url(#bodyGrad)" stroke="#1a0033" stroke-width="4" />

        <!-- Horns / antennae -->
        <path d="M172 70 Q160 30 185 45" fill="none" stroke="#ffd000" stroke-width="7" stroke-linecap="round" />
        <path d="M228 70 Q240 30 215 45" fill="none" stroke="#00ff9d" stroke-width="7" stroke-linecap="round" />
        <circle cx="178" cy="40" r="7" fill="#ff2e9a" stroke="#1a0033" stroke-width="2" />
        <circle cx="222" cy="40" r="7" fill="#00c2ff" stroke="#1a0033" stroke-width="2" />

        <!-- Eyes -->
        <circle cx="182" cy="105" r="16" fill="#fff" stroke="#1a0033" stroke-width="3" />
        <circle cx="218" cy="105" r="16" fill="#fff" stroke="#1a0033" stroke-width="3" />
        <circle class="pupil" cx="185" cy="107" r="7" fill="#1a0033" />
        <circle class="pupil" cx="221" cy="107" r="7" fill="#1a0033" />

        <!-- Snout + smile -->
        <ellipse cx="200" cy="135" rx="22" ry="15" fill="#ff7a00" stroke="#1a0033" stroke-width="3" />
        <path d="M188 138 Q200 150 212 138" fill="none" stroke="#1a0033" stroke-width="3" stroke-linecap="round" />
        <circle cx="194" cy="132" r="2.5" fill="#1a0033" />
        <circle cx="206" cy="132" r="2.5" fill="#1a0033" />

        <!-- Feet -->
        <path d="M165 268 l-6 24 M175 272 l0 24 M185 270 l6 24" stroke="#ffd000" stroke-width="6" stroke-linecap="round" fill="none" />
        <path d="M215 270 l-6 24 M225 272 l0 24 M235 268 l6 24" stroke="#00ff9d" stroke-width="6" stroke-linecap="round" fill="none" />
      </svg>
    </div>

    <p class="caption">Un alebrije — criatura fantástica del arte popular mexicano 🇲🇽</p>
    <a class="btn" href="https://en.wikipedia.org/wiki/Alebrije" target="_blank" rel="noopener">¿Qué es un alebrije?</a>
  </main>

  <footer class="footer">Hecho con 🎨 y mucho color</footer>
</body>
</html>
