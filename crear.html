<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crea tu alebrije · Alebrijes</title>
  <meta name="description" content="Gira las ruletas y mezcla dos animales para crear tu alebrije." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>" />
  <link rel="stylesheet" href="css/sitio.css" />
</head>
<body class="juego">
  <div class="wrap">
    <nav class="nav" aria-label="Principal">
      <a class="logo" href="index.html">Alebrijes</a>
      <ul>
        <li><a href="cuento.html">El cuento</a></li>
        <li><a href="crear.html" aria-current="page">Crea tu alebrije</a></li>
        <li><a href="creditos.html">Créditos</a></li>
      </ul>
    </nav>

    <main class="tablero">
      <section class="casilla area-a">
        <h2>Animal 1</h2>
        <div class="ruleta" id="ruleta-a"><img class="medalla" id="medalla-a" alt="" hidden /></div>
        <p class="ruleta-elegido" id="elegido-a" aria-live="polite"></p>
      </section>

      <section class="casilla area-color">
        <h2>Colores</h2>
        <div class="ruleta" id="ruleta-color"></div>
        <p class="ruleta-elegido" id="elegido-color" aria-live="polite"></p>
      </section>

      <section class="casilla area-b">
        <h2>Animal 2</h2>
        <div class="ruleta" id="ruleta-b"><img class="medalla" id="medalla-b" alt="" hidden /></div>
        <p class="ruleta-elegido" id="elegido-b" aria-live="polite"></p>
      </section>

      <div class="area-accion">
        <button class="btn grande" id="accion" type="button">🎡 Girar animal 1</button>
        <p class="pista" id="pista">Paso 1 de 4</p>
      </div>
    </main>
  </div>

  <dialog class="pop" id="pop-nombre" aria-labelledby="nombre-titulo">
    <div class="pop-tarjeta">
      <div class="picado" aria-hidden="true"></div>
      <p class="pop-sub">Tu alebrije se llama…</p>
      <h2 class="pop-nombre" id="nombre-titulo"></h2>
      <p class="pop-mezcla" id="nombre-mezcla"></p>
      <button class="btn grande" id="a-colores" type="button">🎨 ¡Ahora los colores!</button>
    </div>
  </dialog>

  <dialog class="pop" id="pop-alebrije" aria-labelledby="alebrije-titulo">
    <div class="pop-tarjeta">
      <div class="picado" aria-hidden="true"></div>
      <h2 class="pop-nombre chico" id="alebrije-titulo"></h2>
      <canvas class="lienzo" id="lienzo-mezcla" width="1024" height="1024" role="img"></canvas>
      <div class="acciones">
        <button class="btn" id="descargar" type="button">⬇️ Guardar</button>
        <button class="btn secundario" id="otra-vez" type="button">🔄 Otra vez</button>
      </div>
    </div>
  </dialog>

  <canvas class="confeti" id="confeti" aria-hidden="true"></canvas>

  <script type="module" src="js/crear.js"></script>
</body>
</html>
