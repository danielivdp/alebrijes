<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crea tu alebrije · Alebrijes</title>
  <meta name="description" content="Gira las ruletas y mezcla dos animales para crear tu alebrije." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>" />
  <link rel="stylesheet" href="css/sitio.css?v=10" />
</head>
<body class="juego">
  <div class="wrap">
    <nav class="nav" aria-label="Principal">
      <a class="logo" href="index.html">Alebrijes</a>
      <ul>
        <li><a href="cuento.html">El cuento</a></li>
        <li><a href="crear.html" aria-current="page">Crea tu alebrije</a></li>
        <li><a href="pintar.html">¡A pintar!</a></li>
        <li><a href="creditos.html">Créditos</a></li>
      </ul>
    </nav>

    <ol class="progreso" aria-label="Tu alebrije hasta ahora">
      <li class="ficha" id="ficha-a"><span class="ficha-img">?</span><span class="ficha-txt">Animal 1</span></li>
      <li class="signo" aria-hidden="true">+</li>
      <li class="ficha" id="ficha-b"><span class="ficha-img">?</span><span class="ficha-txt">Animal 2</span></li>
      <li class="signo" aria-hidden="true">=</li>
      <li class="ficha" id="ficha-nombre"><span class="ficha-img">✨</span><span class="ficha-txt">¿?</span></li>
    </ol>

    <main class="escenario" id="escenario">
      <h2 class="titulo-paso" id="titulo-paso"></h2>
      <div class="ruedas">
        <div class="ruleta" id="ruleta-a"><div class="medalla" id="medalla-a" hidden><img alt="" /></div></div>
        <span class="signo-duo" aria-hidden="true">+</span>
        <div class="ruleta" id="ruleta-b" hidden><div class="medalla" id="medalla-b" hidden><img alt="" /></div></div>
        <div class="ruleta" id="ruleta-color" hidden></div>
      </div>
      <p class="nombre-revelado" id="nombre-revelado" aria-live="polite" hidden></p>
      <p class="ruleta-elegido" id="elegido" aria-live="polite"></p>
      <button class="btn grande" id="accion" type="button"></button>
    </main>
  </div>

  <dialog class="pop" id="pop-alebrije" aria-labelledby="alebrije-titulo">
    <div class="pop-tarjeta">
      <div class="picado" aria-hidden="true"></div>
      <h2 class="pop-nombre chico" id="alebrije-titulo"></h2>
      <canvas class="lienzo" id="lienzo-mezcla" width="1024" height="1024" role="img"></canvas>
      <div class="acciones">
        <button class="btn grande" id="otra-vez" type="button">🔄 Hacer otro alebrije</button>
        <button class="btn secundario" id="descargar" type="button">⬇️ Guardar</button>
      </div>
    </div>
  </dialog>

  <p class="pista" aria-hidden="true">␣ Espacio para avanzar</p>
  <canvas class="confeti" id="confeti" aria-hidden="true"></canvas>

  <script type="module" src="js/crear.js?v=10"></script>
</body>
</html>
